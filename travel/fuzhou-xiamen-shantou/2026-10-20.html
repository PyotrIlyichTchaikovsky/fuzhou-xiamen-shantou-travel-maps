<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>厦门 → 汕头｜交通日｜当日路线图</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#183044;background:#f8fafb}*{box-sizing:border-box}body{margin:0}header{padding:13px 16px 10px;background:#fff;border-bottom:1px solid #e4eaed}h1{font-size:19px;line-height:1.35;margin:0 0 5px;font-weight:700}header p{font-size:12px;line-height:1.55;color:#526470;margin:0}.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.legend span{font-size:11px;white-space:nowrap;padding:4px 8px;border-radius:20px;background:#f0f4f5}.legend i{display:inline-block;width:15px;height:3px;vertical-align:middle;margin-right:5px}.map-wrap{position:relative;height:min(65vh,560px);min-height:330px}#map{position:absolute;inset:0}.maplibregl-ctrl-attrib{font-size:9px!important}.marker{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:#123b64;border:3px solid white;color:#fff;box-shadow:0 2px 8px #15344e66;font-size:17px;font-weight:800;cursor:pointer}.marker:focus{outline:3px solid #ffbd66}.maplibregl-popup-content{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;border-radius:10px;padding:12px 14px;max-width:240px;box-shadow:0 5px 18px #1235}.popup-title{font-size:15px;font-weight:700;margin-bottom:6px}.popup-body{font-size:12px;line-height:1.6}.popup-body b{color:#415768}.bar{padding:10px 14px;background:#fff;border-top:1px solid #e4eaed}.bar h2{font-size:14px;margin:0 0 7px}.stop-list{display:flex;flex-wrap:wrap;gap:5px}.stop-list button,.choices button{border:1px solid #dbe4e7;background:#fff;border-radius:7px;padding:7px 9px;font:inherit;font-size:12px;color:#1d394b;cursor:pointer}.stop-list button:hover,.choices button:hover,.choices button.active{border-color:#137e85;background:#e9f8f7}.choices{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}.hint{font-size:11px;color:#69808c;margin:8px 0 0}#status{position:absolute;left:10px;top:10px;background:#fffdf7;color:#5a4d32;border:1px solid #d4c7a8;border-radius:8px;font-size:12px;padding:8px;display:none;z-index:5}a{color:#176484}@media(max-width:600px){header{padding:10px 12px 9px}h1{font-size:16px}.map-wrap{height:55vh;min-height:315px}.bar{padding:9px 11px}}
</style></head><body>
<header><h1 id="heading"></h1><p id="note"></p><div class="choices" id="choices"></div><div class="legend"><span><i style="background:#0d9488"></i>步行</span><span><i style="background:#e77835"></i>打车／包车／景区车</span><span><i style="background:#5579b0"></i>轮渡／动车示意</span></div></header>
<main><div class="map-wrap"><div id="map" aria-label="交互式路线地图"></div><div id="status"></div></div><section class="bar"><h2>游览顺序 · 点按地点看详情</h2><div class="stop-list" id="list"></div><p class="hint">彩色线标明路段方式。步行／动车直线为路线关系示意；驾车线按道路服务生成。实际交通以现场开放和车票为准。</p></section></main>
<script id="route-data" type="application/json">{"title":"厦门 → 汕头｜交通日","city":"交通","note":"原攻略只确定下午动车，尚未指定厦门出发站。地图用厦门北站作示意；购票后以实际车站为准。","points":[{"name":"厦门北站（示意）","coord":[118.0686353,24.6397375],"what":"乘车与行李办理","stay":"依车票为准","source":"https://www.openstreetmap.org/search?query=厦门北站","datum":"WGS84"},{"name":"汕头站","coord":[116.7524295,23.3746875],"what":"抵达汕头","stay":"依车票为准","source":"https://www.openstreetmap.org/search?query=汕头站","datum":"WGS84"}],"modes":["动车示意"],"segments":[{"mode":"动车示意","coords":[[118.0686353,24.6397375],[116.7524295,23.3746875]]}]}</script>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';
const data=JSON.parse(document.getElementById('route-data').textContent), mapbox=document.getElementById('map'), list=document.getElementById('list'), status=document.getElementById('status');
document.getElementById('heading').textContent=data.title;document.getElementById('note').textContent=data.note;
let map,markers=[],active=0;
function shade(mode){return /步行/.test(mode)?'#0d9488':/动车|轮渡/.test(mode)?'#5579b0':'#e77835'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function popup(point,i){return '<div class="popup-title">'+(i+1)+' · '+esc(point.name)+'</div><div class="popup-body"><b>主要看什么：</b>'+esc(point.what)+'<br><b>建议停留：</b>'+esc(point.stay)+'</div>'}
function pointsFor(choice){return choice===0?data.points:data.alternatives[choice-1].points}
function segmentsFor(choice){return choice===0?data.segments:[]}
function show(choice){active=choice;markers.forEach(m=>m.remove());markers=[];list.replaceChildren();if(!map)return;
  const pts=pointsFor(choice), segs=segmentsFor(choice), bounds=new maplibregl.LngLatBounds();
  pts.forEach((pt,i)=>{bounds.extend(pt.coord);const el=document.createElement('button');el.className='marker';el.textContent=i+1;el.setAttribute('aria-label',(i+1)+' '+pt.name);const pop=new maplibregl.Popup({offset:20,maxWidth:'270px'}).setHTML(popup(pt,i));const marker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(pt.coord).setPopup(pop).addTo(map);markers.push(marker);const b=document.createElement('button');b.textContent=(i+1)+' '+pt.name;b.onclick=()=>{map.easeTo({center:pt.coord,zoom:Math.max(map.getZoom(),14),duration:500});marker.togglePopup()};list.appendChild(b)});
  const old=map.getStyle()?.layers?.filter(x=>x.id.startsWith('route-'))||[];old.forEach(x=>map.removeLayer(x.id));['route-line'].forEach(x=>{if(map.getSource(x))map.removeSource(x)});
  if(segs.length){const features=segs.map(s=>({type:'Feature',properties:{mode:s.mode,color:shade(s.mode)},geometry:{type:'LineString',coordinates:s.coords}}));map.addSource('route-line',{type:'geojson',data:{type:'FeatureCollection',features}});map.addLayer({id:'route-line-casing',type:'line',source:'route-line',paint:{'line-color':'#fff','line-width':7,'line-opacity':.92}});map.addLayer({id:'route-line-color',type:'line',source:'route-line',paint:{'line-color':['get','color'],'line-width':4,'line-opacity':.96}})}
  if(pts.length===1)map.easeTo({center:pts[0].coord,zoom:14,duration:0});else map.fitBounds(bounds,{padding:{top:45,bottom:48,left:42,right:42},maxZoom:15,duration:0});
  document.querySelectorAll('.choices button').forEach((b,i)=>b.classList.toggle('active',i===choice));
}
if(data.alternatives){const choices=document.getElementById('choices');['轮渡（最轻松）',...data.alternatives.map(x=>x.label)].forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>show(i);choices.appendChild(b)})}
try{map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:data.points[0].coord,zoom:12,attributionControl:true,localIdeographFontFamily:'"PingFang SC","Microsoft YaHei",sans-serif'});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');map.on('load',()=>{for(const layer of map.getStyle().layers){if(/poi|airport|transit/.test(layer.id)&&layer.type==='symbol'){try{map.setLayoutProperty(layer.id,'visibility','none')}catch{}}}show(0)});map.on('error',e=>{if(e.error&&/style|tile|network/i.test(String(e.error.message))){status.textContent='底图加载较慢，请检查网络后刷新；路线点仍可在下方查看。';status.style.display='block'}})}catch(e){status.textContent='地图加载失败：'+e.message;status.style.display='block'}
</script></body></html>
