<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';
const data=JSON.parse(document.getElementById('route-data').textContent), mapbox=document.getElementById('map'), list=document.getElementById('list'), status=document.getElementById('status');

let map,markers=[],active=0;
function shade(mode){return /步行/.test(mode)?'#0d9488':/动车|轮渡/.test(mode)?'#5579b0':'#e77835'}

function pointsFor(choice){return choice===0?data.points:data.alternatives[choice-1].points}
function segmentsFor(choice){return choice===0?data.segments:[]}
function show(choice){active=choice;markers.forEach(m=>m.remove());markers=[];list.replaceChildren();if(!map)return;
  const pts=pointsFor(choice), segs=segmentsFor(choice), bounds=new maplibregl.LngLatBounds();
  pts.forEach((pt,i)=>{bounds.extend(pt.coord);const el=document.createElement('button');el.className='marker';el.textContent=i+1;el.setAttribute('aria-label',(i+1)+' '+pt.name);const pop=new maplibregl.Popup({offset:20,maxWidth:'270px'}).setHTML(popup(pt,i));const marker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(pt.coord).setPopup(pop).addTo(map);markers.push(marker);const b=document.createElement('button');b.textContent=(i+1)+' '+pt.name;b.onclick=()=>{map.easeTo({center:pt.coord,zoom:Math.max(map.getZoom(),14),duration:500});marker.togglePopup()};list.appendChild(b)});
  const old=map.getStyle()?.layers?.filter(x=>x.id.startsWith('route-'))||[];old.forEach(x=>map.removeLayer(x.id));['route-line'].forEach(x=>{if(map.getSource(x))map.removeSource(x)});
  if(segs.length){const features=segs.map(s=>({type:'Feature',properties:{mode:s.mode,color:shade(s.mode)},geometry:{type:'LineString',coordinates:s.coords}}));map.addSource('route-line',{type:'geojson',data:{type:'FeatureCollection',features}});map.addLayer({id:'route-line-casing',type:'line',source:'route-line',paint:{'line-color':'#fff','line-width':7,'line-opacity':.92}});map.addLayer({id:'route-line-color',type:'line',source:'route-line',paint:{'line-color':['get','color'],'line-width':4,'line-opacity':.96}})}

}
