<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>汕头｜城市与南澳岛路线总图</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
<style>
#open-large{display:none;position:fixed;bottom:9px;left:9px;z-index:1000;border:1px solid #bed0d9;border-radius:8px;background:#fff;color:#173d53;padding:6px 9px;font:600 12px system-ui,"Microsoft YaHei",sans-serif;text-decoration:none;box-shadow:0 2px 8px #1233}body.is-embedded #open-large{display:block}body.is-embedded header{padding:6px 10px}body.is-embedded header p{display:none}body.is-embedded h1{font-size:14px;margin:0}body.is-embedded .legend{margin-top:4px;gap:4px}body.is-embedded .legend span{font-size:10px;padding:2px 5px}body.is-embedded .filters{padding:5px 0 0}body.is-embedded .filters button{padding:4px 7px;font-size:11px}body.is-embedded .map-wrap{height:calc(100vh - 98px);min-height:0;max-height:none}body.is-embedded .bar{display:none}
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#183044;background:#f8fafb}*{box-sizing:border-box}body{margin:0}header{padding:14px 16px 11px;background:#fff;border-bottom:1px solid #e3e9ed}h1{font-size:20px;line-height:1.35;margin:0 0 5px}header p{font-size:12px;line-height:1.5;color:#526470;margin:0}.filters{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}.filters button{border:1px solid #d7e2e7;background:#fff;color:#234154;border-radius:18px;padding:7px 11px;font:inherit;font-size:12px;white-space:nowrap;cursor:pointer}.filters button.active{background:#174667;color:#fff;border-color:#174667}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;font-size:11px;color:#526470}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{display:inline-block;width:17px;border-top:4px solid var(--c)}.legend .dash{border-top-style:dashed}.map-wrap{height:min(61vh,550px);min-height:340px;position:relative}#map{position:absolute;inset:0}.maplibregl-ctrl-attrib{font-size:9px!important}.pin{display:grid;place-items:center;min-width:29px;height:29px;padding:0 3px;border-radius:18px;border:3px solid #fff;background:#16466b;color:#fff;font-size:13px;font-weight:800;box-shadow:0 2px 8px #15344e66;cursor:pointer}.pin:focus{outline:3px solid #ffbd66}.maplibregl-popup-content{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;border-radius:10px;padding:11px 13px;max-width:265px;box-shadow:0 5px 18px #1235}.pop-title{font-size:15px;font-weight:700;margin-bottom:5px}.pop-body{font-size:12px;line-height:1.55}.pop-days{color:#496678;font-size:11px;margin-top:6px}.bar{padding:10px 14px 16px;background:#fff;border-top:1px solid #e4eaed}.bar h2{font-size:15px;margin:0 0 8px}.day-section{margin:10px 0}.day-section h3{font-size:12px;margin:0 0 6px;display:flex;align-items:center;gap:7px}.swatch{width:13px;height:13px;border-radius:50%;display:inline-block;background:var(--c)}.stop-list{display:flex;gap:5px;flex-wrap:wrap}.stop-list button{border:1px solid #dbe4e7;background:#fff;border-radius:7px;padding:6px 8px;font:inherit;font-size:12px;color:#1d394b;cursor:pointer}.stop-list button:hover{border-color:#137e85;background:#e9f8f7}.hint{font-size:11px;color:#69808c;margin:10px 0 0}#status{position:absolute;left:10px;top:10px;background:#fffdf7;color:#5a4d32;border:1px solid #d4c7a8;border-radius:8px;font-size:12px;padding:8px;display:none;z-index:5}@media(max-width:600px){header{padding:10px 12px}h1{font-size:17px}.map-wrap{height:54vh;min-height:315px}.bar{padding:9px 11px 15px}}
</style></head><body><script>if(window.self!==window.top)document.body.classList.add('is-embedded')</script><a id="open-large" href="" target="_blank" rel="noopener">↗ 打开大图</a><script>document.getElementById('open-large').href=location.href</script>
<header><h1 id="heading"></h1><p id="note"></p><nav class="filters" id="filters" aria-label="按日期查看路线"></nav><div class="legend" id="legend"></div></header>
<main><div class="map-wrap"><div id="map" aria-label="城市交互路线总图"></div><div id="status"></div></div><section class="bar"><h2>地点与游览顺序 · 点按查看详情</h2><div id="sections"></div><p class="hint">同一天的线路使用同一种颜色；虚线表示步行、索道或动车示意，实线表示打车或驾车路线。各日期路线独立显示，不表示跨日连续行走。酒店片区示意点请以订单导航为准。</p></section></main>
<script id="city-source" type="application/json">{"title":"汕头｜城市与南澳岛路线总图","note":"汇总10月20日至23日的汕头行程。点选日期可只看当天路线；地点和顺序以每日路线数据为准。","sections":[{"date":"2026-10-20","label":"10/20 老城","start":0,"end":null,"extras":false},{"date":"2026-10-21","label":"10/21 南澳岛","start":0,"end":null,"extras":false},{"date":"2026-10-22","label":"10/22 机动选项","start":0,"end":null,"extras":true},{"date":"2026-10-23","label":"10/23 G1176返程","start":0,"end":null,"extras":false}]}</script>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';
async function loadRoute(path){
  const url=new URL(path,location.href);url.searchParams.set('rev',String(Date.now()));
  try{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);return await response.json()}
  catch(error){const box=document.getElementById('status');box.textContent='路线数据暂时无法加载，请刷新重试。';box.style.display='block';throw error}
}
const config=JSON.parse(document.getElementById('city-source').textContent);
const fetched=await Promise.all(config.sections.map(s=>loadRoute('../routes/'+s.date+'.json')));
const data={title:config.title,note:config.note,sections:config.sections.map((s,i)=>{
  const day=fetched[i],points=day.points.slice(s.start,s.end===null?undefined:s.end);
  const segments=day.segments.slice(s.start,s.end===null?undefined:s.end-1);
  if(s.extras)for(const option of day.alternatives||[])for(const point of option.points)points.push({...point,name:point.name+'（可选）'});
  const summary=day.title.includes('｜')?day.title.split('｜').slice(1).join('｜'):day.title;
  return {label:s.date.slice(5).replace('-','/')+' '+summary,points,segments};
})},filters=document.getElementById('filters'),legend=document.getElementById('legend'),sections=document.getElementById('sections'),status=document.getElementById('status');
document.getElementById('heading').textContent=data.title;document.getElementById('note').textContent=data.note;
const palette=['#d65c38','#137e85','#7159a8','#aa751e','#336da9','#8e527b'];let map,markers=[],lineIds=[],active=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function key(p){return p.coord.map(x=>Number(x).toFixed(5)).join(',')}
function chosen(){return active===0?data.sections:[data.sections[active-1]]}
function popup(g){const first=g.visits[0].point,days=g.visits.map(v=>esc(v.section.label)+' · '+(v.n+1)).join('、');const names=[...new Set(g.visits.map(v=>v.point.name))];return '<div class="pop-title">'+esc(names.join('／'))+'</div><div class="pop-body"><b>主要看什么：</b>'+esc(first.what)+'<br><b>建议停留：</b>'+esc(first.stay)+'</div><div class="pop-days">出现于：'+days+'</div>'}
function clear(){markers.forEach(m=>m.remove());markers=[];for(const id of lineIds.reverse()){if(map.getLayer(id+'-line'))map.removeLayer(id+'-line');if(map.getLayer(id+'-case'))map.removeLayer(id+'-case');if(map.getSource(id))map.removeSource(id)}lineIds=[]}
function render(){if(!map)return;clear();sections.replaceChildren();const groups=new Map(),bounds=new maplibregl.LngLatBounds(),sel=chosen();
  sel.forEach(section=>section.points.forEach((p,n)=>{const k=key(p);if(!groups.has(k))groups.set(k,{point:p,visits:[]});groups.get(k).visits.push({section,n,point:p});bounds.extend(p.coord)}));
  let ix=0;for(const [k,g] of groups){const label=active===0?String(++ix):[...new Set(g.visits.map(v=>v.n+1))].join('·');const el=document.createElement('button');el.className='pin';el.textContent=label;el.setAttribute('aria-label',label+' '+g.point.name);const marker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(g.point.coord).setPopup(new maplibregl.Popup({offset:19,maxWidth:'280px'}).setHTML(popup(g))).addTo(map);g.marker=marker;markers.push(marker)}
  let sn=0;sel.forEach(section=>{const c=palette[data.sections.indexOf(section)%palette.length];section.segments.forEach(seg=>{if(!seg.coords||seg.coords.length<2)return;const id='city-route-'+(++sn),dashed=/步行|索道|动车|轮渡|示意/.test(seg.mode);map.addSource(id,{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:seg.coords}}});map.addLayer({id:id+'-case',source:id,type:'line',paint:{'line-color':'#fff','line-width':7,'line-opacity':.88}});map.addLayer({id:id+'-line',source:id,type:'line',paint:{'line-color':c,'line-width':4,'line-opacity':.96,...(dashed?{'line-dasharray':[2,2]}:{})}});lineIds.push(id)});
    const wrapper=document.createElement('div');wrapper.className='day-section';const head=document.createElement('h3');head.innerHTML='<span class="swatch" style="--c:'+c+'"></span>'+esc(section.label);wrapper.appendChild(head);const list=document.createElement('div');list.className='stop-list';section.points.forEach((p,n)=>{const b=document.createElement('button');b.textContent=(n+1)+' '+p.name;b.onclick=()=>{const g=groups.get(key(p));map.easeTo({center:p.coord,zoom:Math.max(map.getZoom(),13),duration:400});g.marker.togglePopup()};list.appendChild(b)});wrapper.appendChild(list);sections.appendChild(wrapper)});
  if(groups.size===1)map.easeTo({center:[...groups.values()][0].point.coord,zoom:13,duration:0});else map.fitBounds(bounds,{padding:{top:45,bottom:50,left:44,right:44},maxZoom:14,duration:0});document.querySelectorAll('#filters button').forEach((b,i)=>b.classList.toggle('active',i===active));
}
['全部',...data.sections.map(s=>s.label)].forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{active=i;render()};filters.appendChild(b)});data.sections.forEach((s,i)=>{const label=document.createElement('span');label.innerHTML='<i style="--c:'+palette[i%palette.length]+'"></i>'+esc(s.label);legend.appendChild(label)});const dashed=document.createElement('span');dashed.innerHTML='<i class="dash" style="--c:#526470"></i>步行／动车／索道示意';legend.appendChild(dashed);
try{map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:data.sections[0].points[0].coord,zoom:10,attributionControl:true,localIdeographFontFamily:'"PingFang SC","Microsoft YaHei",sans-serif'});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');map.on('load',()=>{for(const layer of map.getStyle().layers){if(/poi|airport|transit/.test(layer.id)&&layer.type==='symbol'){try{map.setLayoutProperty(layer.id,'visibility','none')}catch{}}}render()});map.on('error',e=>{if(e.error&&/style|tile|network/i.test(String(e.error.message))){status.textContent='底图加载较慢，可稍后刷新。';status.style.display='block'}})}catch(e){status.textContent='地图加载失败：'+e.message;status.style.display='block'}
</script></body></html>
